name: Portfolio gate (social proof · sibling parity)

# The shared checks from @caistech/portfolio-gate, run here rather than admired
# from a distance.
#
# This portfolio has already paid twice for a guard that existed and never ran:
# `probeMemoryLoop` shipped in convai 0.7.0 and ran in ZERO repos while the bug it
# guarded reached production twice, and ExecutorAI served a month-old production
# build because nothing asserted the deployed SHA. Writing the check is the cheap
# half; this file is the half that makes it real.
#
# The package is a devDependency rather than an `npx` fetch, so the version is
# pinned in the lockfile and comes down with the normal install. `npx` was tried
# first and is the wrong shape here: it re-downloads the package on every run
# (2-7 minutes), and `npx <pkg> <bin>` silently looks for a binary NAMED AFTER
# THE PACKAGE — with differently-named bins it fails "could not determine
# executable to run", which is what the first version of this workflow would
# have done on its first firing.

on:
  # The offer-claims job runs on PULL REQUESTS as well, and blocks. The other two
  # judge published content and live sites rather than the diff, so they stay on
  # the schedule — see the `if:` on each.
  pull_request:
  schedule:
    - cron: "0 23 * * *" # daily, 23:00 UTC ≈ 09:00 Brisbane
  workflow_dispatch:
    inputs:
      force_report:
        description: "Treat this run as failed, to test the issue routing end to end"
        type: boolean
        default: false

jobs:
  social-proof:
    name: No fabricated or unattested social proof
    # Not on PRs: it reports 3 findings that are a CLIENT decision (the case-study
    # testimonials, SCRUM-383). Blocking every pull request on something no engineer
    # can resolve is exactly how a check gets switched off for good.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: pnpm install --frozen-lockfile

      # A REGULATED-tier client's live site carried eight real ASX-listed builders
      # as "Trusted Partners" — none of whom were partners — plus three invented
      # testimonials and "100+ professionals / $2M saved", for months. Nothing
      # looked for it.
      #
      # ⚠️ NOT ON PULL REQUESTS YET, AND THIS IS THE ONLY REASON WHY:
      # as of 9 August it reports 9 findings here — unattested testimonial blocks,
      # a partners block and a headline metric. Every one needs a person to say
      # "yes, this is real, and here is the source". That is not a judgement an
      # engineer or a script can make on the client's behalf; it is the entire
      # premise of the check.
      #
      # So it runs daily and reports, rather than blocking work it cannot resolve.
      # It moves to `pull_request` the day the count reaches zero — and the number
      # above is the measure of whether that is happening, rather than a promise
      # that quietly expires.
      - name: Audit social proof
        run: pnpm exec portfolio-gate-audit-social-proof
        continue-on-error: true

  sibling-parity:
    name: The two MMC repos agree with each other
    # Not on PRs: half of what it asserts is about the LIVE sites, which a pull
    # request has not changed yet.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the application
        uses: actions/checkout@v4
        with:
          path: mmcbuild-application

      # Both repos side by side, so the file and dependency comparison actually
      # runs. Without this the audit still works but SKIPS that half with a
      # warning — honest, and half as useful.
      #
      # Needs a token with read access to the sibling repository. If this step
      # 404s, that is the fix, and it fails loudly here rather than degrading
      # quietly — a comparison that silently compared one repo to itself would
      # pass forever.
      - name: Checkout the marketing site
        uses: actions/checkout@v4
        with:
          repository: mmcbuildai/mmcbuild-marketing
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          path: mmcbuild-marketing

      # `package_json_file` is required HERE and not in the job above, and the
      # difference is the whole reason this failed on its first run: this job
      # checks out the application into a SUBDIRECTORY so the marketing repo can
      # sit beside it, which leaves no package.json at the workspace root — and
      # pnpm/action-setup reads the pnpm version from `packageManager` there.
      #
      # Pointing it at the file rather than pinning `version:` keeps this repo's
      # existing convention (see the note in ci.yml): the version comes from
      # package.json, so it cannot drift out of step with what everything else
      # installs.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mmcbuild-application/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: mmcbuild-application
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: pnpm install --frozen-lockfile

      # Run from the PARENT of both clones, with the config from this repo, so
      # the sibling paths in it resolve.
      - name: Audit sibling parity
        run: >
          ./mmcbuild-application/node_modules/.bin/portfolio-gate-audit-sibling-parity
          --root .
          --config mmcbuild-application/sibling-parity.config.json

  offer-claims:
    name: Prices and trial length match what we actually charge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: pnpm install --frozen-lockfile

      # In one week this site published FOUR different descriptions of the same
      # offer: a FAQ promising Essential "free for 1 month", a plan badge saying
      # the same, a call-to-action claiming "card required at sign-up" four
      # inches from a signup page reading "No credit card required", and an
      # assistant reporting a "60-day free trial". The truth was 14 days, no
      # card, every plan. Two had been live for months, on a site taking money.
      #
      # None of them ever appeared in a diff. They were not changes — they were
      # statements that stopped being true while nobody looked at them, which is
      # why every other check in this file would have passed straight over them.
      #
      # ⚠️ REPORT-ONLY, for the same reason as the social-proof job above and no
      # other: as of 9 August it reports the supplier tiers ("$99 Basic
      # Directory", "$499 Professional Directory", "first 2 months free"), which
      # match neither the confirmed $199/$299 model nor anything purchasable.
      # Those figures are already gated out of the live site and correcting them
      # is Karen's decision, not something a build should block on. It moves to
      # `pull_request` the day the count reaches zero — and the count is the
      # measure of whether that is happening, rather than a promise that expires.
      # BLOCKING as of 2026-08-09, and only because the count reached ZERO that
      # day. Every figure the two sites state now matches a live Stripe Price,
      # and every free-trial length matches what a new account actually gets.
      #
      # Turning it on while it is clean costs nothing. Waiting until it has
      # findings turns switching it on into an argument about somebody's open
      # ticket, which is how a check ends up permanently "temporarily" advisory —
      # the social-proof job above is sitting in exactly that position.
      #
      # A figure that is legitimately different — a genuine comparison price — is
      # not a reason to switch this off. It takes one line naming what
      # substantiates it:
      #     // @offer-claim-ok: <what this figure is, who confirmed it, when>
      #
      # ⚠️ `verifyAgainstStripe` is still OFF, so this can tell you the PAGE
      # disagrees with the config, but NOT that the config itself has gone stale.
      # Closing that needs a Stripe restricted key (Prices:Read) in the repo
      # secrets. Until then the declared prices are only as current as the last
      # hand-check, which was 2026-08-09.
      - name: Audit offer claims
        run: pnpm exec portfolio-gate-audit-offer-claims

  route-result:
    name: Route the result to a human
    # THE GAP THIS CLOSES. A pull_request failure paints a red X in a page the
    # author already has open; a workflow_dispatch has someone watching it. The
    # nightly cron has NO recipient — GitHub emails only whoever last edited the
    # cron expression, into the same stream as every other notification, which in
    # practice is nobody.
    #
    # On 9 Aug this workflow went from green (8 Aug, every job) to red naming
    # exactly ONE job, and it sat unread for a day while the two pricing pages
    # contradicted each other about the customer's card on a product taking real
    # payments. The signal was as clean as CI gets. Nobody was drowning in noise;
    # nobody was looking.
    #
    # ⚠️ An earlier note in sibling-parity.config.json blamed alert fatigue and was
    # WRONG (corrected in #173). That matters here because the wrong diagnosis
    # implies the wrong fix — "clear the findings, soften the checks" — when the
    # actual problem is that an unattended run has nowhere to arrive.
    #
    # Runs for the SCHEDULE and for any manual dispatch; never for a pull request,
    # where a red X already reaches the author and an issue would be pure noise.
    #
    # ⚠️ It was first written as `schedule || force_report`, and testing it caught
    # the flaw: an ordinary dispatch then SKIPPED this job, so someone who fixed
    # the gate and re-ran it by hand would watch the issue stay open and conclude
    # the auto-close was broken. A manual re-run is the most likely way a fix gets
    # confirmed, so it must be able to clear the state it is confirming.
    #
    # `force_report` therefore only controls whether to SIMULATE a failure — it is
    # not the gate on whether routing runs at all. Its purpose is that the routing
    # can be TESTED rather than assumed to work: this repo has already paid twice
    # for guards that existed and never ran.
    if: always() && github.event_name != 'pull_request'
    needs: [social-proof, sibling-parity, offer-claims]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOCIAL: ${{ needs.social-proof.result }}
          PARITY: ${{ needs.sibling-parity.result }}
          CLAIMS: ${{ needs.offer-claims.result }}
          FORCED: ${{ github.event.inputs.force_report }}
        run: |
          set -euo pipefail

          # An ISSUE rather than an email, deliberately. An email is a moment you
          # can miss exactly once and lose for good; an issue is a STATE that
          # survives being missed. This repo already works through issues
          # (`gh issue list --label accept`), so it is a page someone opens.
          LABEL="gate-failure"
          gh label create "$LABEL" --color B60205 \
            --description "A nightly portfolio-gate run failed and needs a human" \
            --force >/dev/null 2>&1 || true

          # Written as explicit `if` blocks, not `[ test ] && VAR=...`. Under
          # `set -e` a false test at the END of a script aborts it — so the
          # concise form works today only because other lines follow it, and
          # would silently stop reporting the day someone reorders them. A guard
          # that fails closed by accident of line order is not a guard.
          FAILED=""
          if [ "$SOCIAL" = "failure" ]; then
            FAILED="${FAILED}- No fabricated or unattested social proof"$'\n'
          fi
          if [ "$PARITY" = "failure" ]; then
            FAILED="${FAILED}- The two MMC repos agree with each other"$'\n'
          fi
          if [ "$CLAIMS" = "failure" ]; then
            FAILED="${FAILED}- Prices and trial length match what we actually charge"$'\n'
          fi
          if [ "${FORCED:-}" = "true" ]; then
            FAILED="${FAILED}- (SIMULATED via force_report — a routing test, not a real finding)"$'\n'
          fi

          # Dedupe on the LABEL, not the title: the title names which checks failed
          # and that set changes between runs, so matching on it would file a fresh
          # issue every night. One open issue per outage, commented on — thirty
          # issues in a month is how a channel becomes the noise it was built to
          # cut through.
          EXISTING="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$FAILED" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "Failed again — $RUN_URL

          $FAILED"
              echo "commented on #$EXISTING"
            else
              gh issue create --label "$LABEL" \
                --title "Nightly portfolio gate is failing — a check nobody is watching went red" \
                --body "The scheduled \`portfolio-gate\` run failed. Nothing else will tell you: a cron has no author to notify and no pull request to block, which is exactly how the 9 August pricing drift stayed live for a day.

          **Failing checks**

          $FAILED
          **Run:** $RUN_URL

          ---

          This issue closes ITSELF on the next green scheduled run, so it is safe to leave open — it is tracking a state, not asking for acknowledgement. If it is still open, the gate is still red." >/dev/null
              echo "opened a new tracking issue"
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Green again — $RUN_URL

          Closing automatically. A signal nobody clears decays into wallpaper, which defeats the point of routing it here." >/dev/null
              echo "closed #$EXISTING"
            else
              echo "all checks green, nothing open — nothing to do"
            fi
          fi
