name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 20:00 UTC = 06:00 Brisbane. Drives the schema-drift job only; a cron is
    # required because drift can appear with no push at all (a migration merged
    # days ago and still not applied looks identical to a healthy repo).
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Private @caistech packages require auth against GitHub Packages.
      # Prefers a repo/org secret GITHUB_PACKAGES_TOKEN with read:packages.
      # Falls back to the built-in GITHUB_TOKEN (works only if all packages
      # live in the same org; otherwise set GITHUB_PACKAGES_TOKEN secret).
      # .npmrc reads ${GITHUB_PACKAGES_TOKEN} from env; GitHub forbids secret
      # names starting with GITHUB_, so the secret is stored as GH_PACKAGES_TOKEN
      # and aliased here.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth (pinned in 1966aae); specifying a version here
      # too makes action-setup abort with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate (SCRUM-343): fails the build if any server action / route runs
      # an RLS-bypassing db()/admin query filtered by a caller-supplied id with no
      # org-ownership assert (the SCRUM-340/342 cross-tenant class). Genuine
      # cross-org/public/user-owned reads opt out with a // @cross-tenant-ok marker.
      - name: Cross-tenant guard check
        run: pnpm check:cross-tenant

      # Soft — allow pre-existing errors from the in-flight @caistech/*
      # migration to not block CI. Tighten to a hard fail once migration
      # completes (SCRUM follow-up).
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Unit tests
        run: pnpm test

  # Is production's schema actually running the migrations on main? (SCRUM-233)
  #
  # Migrations here reach production via `supabase db push`, which is a manual
  # step — so a migration can be merged and never applied, and nothing about the
  # repo looks wrong afterwards. That is not hypothetical: 00075 sat unapplied
  # for three weeks, leaving the stuck-job reaper failing 42703 on every cron
  # run, Build-3D ghost jobs unreaped, and the SCRUM-309 fix never actually live.
  # 00081 did the same thing earlier and blocked SCRUM-238 for weeks.
  #
  # Deliberately NOT run on pull_request: a PR that adds a migration has not been
  # pushed to production yet, so it would fail by design and train people to
  # ignore it. It runs on merge to main (where an unapplied migration IS the
  # signal) and daily (because drift needs no push to appear).
  schema-drift:
    name: Production schema drift
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Read-only existence probes via PostgREST. See the note in
      # scripts/migration-baseline.mjs — the anon key would suffice; this is the
      # key CI already has. Narrowing it is a tracked follow-up.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No pnpm install: the script is zero-dependency by design, so this job
      # cannot be broken by the dependency graph it is meant to outlive.
      - name: Verify every migration is applied to production
        run: node scripts/migration-baseline.mjs verify

  # Can a BETA-role tester still upload, and still not reach another org? (SCRUM-319)
  #
  # This is the half the schema-drift job cannot see. That check probes for tables
  # and columns, so a migration that only creates RLS policies is reported
  # "unverifiable" and CI stays green whether or not it was ever applied — 26 of
  # the 85 migrations are in that bucket. Storage policies are exactly that shape,
  # and they are also the ones that have broken twice (00066 -> 00071 -> 00072).
  # So this job asserts the BEHAVIOUR instead of the object: it signs in as the
  # beta QA account and tries the uploads, which is the only thing that proves a
  # policy is both present and correct.
  #
  # Same trigger policy as schema-drift, and for the same reason — it judges
  # production, not the pull request. It writes and then deletes one small object
  # per bucket in the QA beta org.
  storage-rls:
    name: Storage RLS (beta role)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mints the QA session via admin generate_link and cleans up afterwards; the
      # uploads under test run as the beta USER, subject to RLS like anyone else.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero-dependency by design, as above.
      - name: Beta-role upload + cross-tenant checks
        run: node scripts/check-storage-rls.mjs

  # E2E runs separately (Playwright is slow + needs browsers + secrets).
  # Manual trigger for now. Promote to on-PR once the suite is stable in CI.
  e2e:
    name: E2E (Playwright) — manual only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # .npmrc reads ${GITHUB_PACKAGES_TOKEN} from env; GitHub forbids secret
      # names starting with GITHUB_, so the secret is stored as GH_PACKAGES_TOKEN
      # and aliased here.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Jira posting for test results (best-effort — missing creds skip gracefully)
      JIRA_HOST: ${{ secrets.JIRA_HOST }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json `packageManager` — see the note above.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Post results to Jira (best-effort — runs even if tests failed,
      # always exits 0 so this step can't fail the build).
      - name: Post results to Jira
        if: always()
        run: node scripts/jira-post-test-results.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regime-results
          path: test-results/regime-results.json
          retention-days: 14
